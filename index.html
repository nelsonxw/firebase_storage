<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Storage Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .config-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .config-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            background: white;
            width: 100%;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background: #138496;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-select-all {
            background: #1f2830;
            color: #ffffff;
            border: 1px solid #141b21;
        }

        .btn-select-all:hover {
            background: #12181e;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(18, 24, 30, 0.25);
        }

        .btn-upload {
            background: #37434f;
            color: #ffffff;
            border: 1px solid #2b353e;
        }

        .btn-upload:hover {
            background: #28323c;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 50, 60, 0.25);
        }

        .btn-create-folder {
            background: #4e5d6a;
            color: #ffffff;
            border: 1px solid #404d57;
        }

        .btn-create-folder:hover {
            background: #3e4b56;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(62, 75, 86, 0.25);
        }

        .btn-refresh {
            background: #697a87;
            color: #ffffff;
            border: 1px solid #586773;
        }

        .btn-refresh:hover {
            background: #566672;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(86, 102, 114, 0.25);
        }

        .main-content {
            padding: 30px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .batch-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .batch-count-badge {
            font-weight: 600;
            color: #4338ca;
            margin-right: 10px;
        }

        .item-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 15px;
            accent-color: #667eea;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            font-weight: 600;
            color: #666;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: #667eea;
            font-weight: 500;
        }

        .breadcrumb-item:hover {
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: #999;
        }

        .file-list {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: #f8f9fa;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #667eea;
            color: white;
            border-radius: 6px;
            margin-right: 15px;
            font-size: 18px;
        }

        .file-folder {
            background: #ffc107;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-meta {
            font-size: 12px;
            color: #666;
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .file-actions button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .hidden {
            display: none;
        }

        .upload-progress {
            margin-top: 10px;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Firebase Storage Manager</h1>
            <p>Manage your Firebase Storage files with ease</p>
        </div>

        <div class="main-content" id="mainContent">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Total Files:</span>
                    <span class="stat-value" id="totalFiles">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Folders:</span>
                    <span class="stat-value" id="totalFolders">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Current Path:</span>
                    <span class="stat-value" id="currentPath">/</span>
                </div>
            </div>

            <div class="toolbar">
                <button class="btn btn-select-all" id="selectAllBtn" onclick="toggleSelectAll()">Select All</button>
                <button class="btn btn-upload" onclick="showUploadModal()">Upload File</button>
                <button class="btn btn-create-folder" onclick="showCreateFolderModal()">Create Folder</button>
                <button class="btn btn-refresh" onclick="refreshFiles()">Refresh</button>
            </div>

            <!-- Batch Action Bar -->
            <div class="batch-toolbar hidden" id="batchToolbar">
                <span class="batch-count-badge" id="selectedCountText">0 selected</span>
                <button class="btn btn-success" onclick="batchDownload()">Download</button>
                <button class="btn btn-info" onclick="showBatchCopyModal()">Copy</button>
                <button class="btn btn-warning" onclick="showBatchMoveModal()">Move</button>
                <button class="btn btn-danger" onclick="batchDelete()">Delete</button>
                <button class="btn btn-secondary" onclick="clearSelection()" style="margin-left: auto;">Cancel</button>
            </div>

            <div class="breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item" onclick="navigateTo('')">Root</span>
            </div>

            <div class="file-list" id="fileList">
                <div class="loading">Loading files...</div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">Upload File</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="fileInput">Select File</label>
                    <input type="file" id="fileInput">
                </div>
                <div class="upload-progress hidden" id="uploadProgress">
                    <div class="upload-progress-bar" id="uploadProgressBar" style="width: 0%"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('uploadModal')">Cancel</button>
                <button class="btn btn-upload" onclick="uploadFile()">Upload</button>
            </div>
        </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal" id="createFolderModal">
        <div class="modal-content">
            <div class="modal-header">Create Folder</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="folderName">Folder Name</label>
                    <input type="text" id="folderName" placeholder="Enter folder name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('createFolderModal')">Cancel</button>
                <button class="btn btn-create-folder" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <!-- Single Copy Modal -->
    <div class="modal" id="singleCopyModal">
        <div class="modal-content">
            <div class="modal-header">Copy File</div>
            <div class="modal-body">
                <p id="singleCopySourceInfo" style="margin-bottom: 15px; color: #555; word-break: break-all;"></p>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="singleCopyDestSelect">Destination Folder</label>
                    <select id="singleCopyDestSelect" onchange="onFolderDropdownChange('singleCopy')">
                        <option value="">/ (Root)</option>
                    </select>
                    <input type="text" id="singleCopyCustomDest" class="hidden" placeholder="Enter custom folder path (e.g. archive/)" style="margin-top: 10px;">
                </div>
                <div class="form-group">
                    <label for="singleCopyFileName">File Name</label>
                    <input type="text" id="singleCopyFileName" placeholder="Enter file name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('singleCopyModal')">Cancel</button>
                <button class="btn btn-info" onclick="executeSingleCopy()">Copy</button>
            </div>
        </div>
    </div>

    <!-- Single Move Modal -->
    <div class="modal" id="singleMoveModal">
        <div class="modal-content">
            <div class="modal-header">Move File</div>
            <div class="modal-body">
                <p id="singleMoveSourceInfo" style="margin-bottom: 15px; color: #555; word-break: break-all;"></p>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="singleMoveDestSelect">Destination Folder</label>
                    <select id="singleMoveDestSelect" onchange="onFolderDropdownChange('singleMove')">
                        <option value="">/ (Root)</option>
                    </select>
                    <input type="text" id="singleMoveCustomDest" class="hidden" placeholder="Enter custom folder path (e.g. archive/)" style="margin-top: 10px;">
                </div>
                <div class="form-group">
                    <label for="singleMoveFileName">File Name</label>
                    <input type="text" id="singleMoveFileName" placeholder="Enter file name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('singleMoveModal')">Cancel</button>
                <button class="btn btn-warning" onclick="executeSingleMove()">Move</button>
            </div>
        </div>
    </div>

    <!-- Single Rename Modal -->
    <div class="modal" id="singleRenameModal">
        <div class="modal-content">
            <div class="modal-header">Rename File</div>
            <div class="modal-body">
                <p id="singleRenameSourceInfo" style="margin-bottom: 15px; color: #555; word-break: break-all;"></p>
                <div class="form-group">
                    <label for="singleRenameFileName">New File Name</label>
                    <input type="text" id="singleRenameFileName" placeholder="Enter new file name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('singleRenameModal')">Cancel</button>
                <button class="btn btn-primary" onclick="executeSingleRename()">Rename</button>
            </div>
        </div>
    </div>

    <!-- Batch Copy Modal -->
    <div class="modal" id="batchCopyModal">
        <div class="modal-content">
            <div class="modal-header">Copy Selected Files</div>
            <div class="modal-body">
                <p id="batchCopySummary" style="margin-bottom: 15px; color: #555;"></p>
                <div class="form-group">
                    <label for="batchCopyDestSelect">Destination Folder</label>
                    <select id="batchCopyDestSelect" onchange="onFolderDropdownChange('batchCopy')">
                        <option value="">/ (Root)</option>
                    </select>
                    <input type="text" id="batchCopyCustomDest" class="hidden" placeholder="Enter custom folder path (e.g. archive/)" style="margin-top: 10px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('batchCopyModal')">Cancel</button>
                <button class="btn btn-info" onclick="executeBatchCopy()">Copy</button>
            </div>
        </div>
    </div>

    <!-- Batch Move Modal -->
    <div class="modal" id="batchMoveModal">
        <div class="modal-content">
            <div class="modal-header">Move Selected Files</div>
            <div class="modal-body">
                <p id="batchMoveSummary" style="margin-bottom: 15px; color: #555;"></p>
                <div class="form-group">
                    <label for="batchMoveDestSelect">Destination Folder</label>
                    <select id="batchMoveDestSelect" onchange="onFolderDropdownChange('batchMove')">
                        <option value="">/ (Root)</option>
                    </select>
                    <input type="text" id="batchMoveCustomDest" class="hidden" placeholder="Enter custom folder path (e.g. archive/)" style="margin-top: 10px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('batchMoveModal')">Cancel</button>
                <button class="btn btn-warning" onclick="executeBatchMove()">Move</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
